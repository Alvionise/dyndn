name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test .\tests\DyndDns.TrayApp.Tests\DyndDns.TrayApp.Tests.csproj -c Release

      - name: Publish
        run: .\publish.ps1 -Output dist

      - name: Package
        run: Compress-Archive -Path .\dist\* -DestinationPath .\dyndns-${{ github.ref_name }}.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dyndns-${{ github.ref_name }}.zip
          generate_release_notes: true
