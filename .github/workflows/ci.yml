name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore .\dyndn.slnx

      - name: Check code style
        run: dotnet format .\dyndn.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build .\dyndn.slnx -c Release --no-restore

      - name: Test
        run: dotnet test .\tests\DyndDns.TrayApp.Tests\DyndDns.TrayApp.Tests.csproj -c Release --no-build
